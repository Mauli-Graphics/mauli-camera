<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>Mauli Graphics - Mobile Camera Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #12131c; color: #fff; margin: 0; padding: 0; }
    .header { background: #1f2133; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2f324d; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 16px; margin: 0; color: #f59e0b; letter-spacing: 0.5px; }
    .badge { background: #2563eb; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }

    /* Login View */
    #loginView { padding: 30px 20px; max-width: 400px; margin: 40px auto 0; text-align: center; }
    .input-box { width: 100%; padding: 12px; margin-bottom: 14px; border-radius: 8px; border: 1px solid #3b3f5c; background: #1a1c29; color: #fff; font-size: 15px; outline: none; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
    .btn-login { background: #2563eb; color: #fff; }
    .btn-logout { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; }

    /* Controls & Dynamic Filters Section */
    .filter-section { background: #1a1c29; border: 1px solid #2c3049; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
    .filter-toggle-btn { background: #32354e; color: #cbd5e1; border: 1px solid #4b5563; font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; }
    .column-picker { display: none; background: #12131c; padding: 10px; border-radius: 8px; margin-top: 8px; border: 1px dashed #4b5563; }
    .col-checkbox-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #cbd5e1; margin-right: 12px; margin-bottom: 6px; cursor: pointer; }
    
    .dynamic-dropdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
    .filter-select { width: 100%; padding: 9px; border-radius: 7px; border: 1px solid #3b3f5c; background: #12131c; color: #fff; font-size: 13px; outline: none; }
    
    .total-counter-bar { display: flex; justify-content: space-between; align-items: center; background: #232538; padding: 8px 12px; border-radius: 6px; margin-top: 10px; font-size: 12px; border-left: 4px solid #10b981; }

    /* Student List View */
    #listView { display: none; padding: 12px; padding-bottom: 50px; }
    .student-card { background: #1a1c29; border: 1px solid #2c3049; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .student-card.done { border-color: #10b981; background: #13221f; }
    .st-info { flex: 1; min-width: 0; }
    .st-info h4 { margin: 0 0 4px 0; font-size: 15px; color: #f3f4f6; word-break: break-word; }
    .st-info p { margin: 0; font-size: 12px; color: #9ca3af; }
    .st-badge { display: inline-block; background: #32354e; color: #93c5fd; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-right: 5px; margin-top: 3px; }

    .action-group { display: flex; gap: 6px; align-items: center; }
    .btn-edit { background: #4b5563; color: #fff; border: none; padding: 9px 12px; border-radius: 7px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-camera { background: #2563eb; color: #fff; border: none; padding: 9px 12px; border-radius: 7px; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-done { background: #10b981; color: #fff; border: none; padding: 9px 12px; border-radius: 7px; font-weight: bold; font-size: 13px; cursor: pointer; }

    /* Camera Fullscreen View */
    #cameraView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; flex-direction: column; }
    .cam-header { position: absolute; top: 15px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; z-index: 102; }
    .cam-student-name { background: rgba(0,0,0,0.65); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #fff; }
    .btn-close-cam { background: rgba(239,68,68,0.85); color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    #videoElement { width: 100%; height: 100%; object-fit: cover; }
    
    /* Face Guide Overlay */
    .face-guide-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 101; }
    .face-guide-box { width: 70vw; height: calc(70vw * 1.25); max-width: 290px; max-height: 360px; border: 2.5px dashed #10b981; border-radius: 14px; position: relative; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.48); }
    .face-guide-box::after { content: "चेहरा या बॉक्समध्ये ठेवा"; position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 12px; white-space: nowrap; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    .cam-controls { position: absolute; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; z-index: 102; }
    .btn-snap { width: 72px; height: 72px; background: #fff; border: 4px solid #2563eb; border-radius: 50%; outline: none; box-shadow: 0 0 20px rgba(0,0,0,0.6); cursor: pointer; }
    .btn-snap:active { transform: scale(0.92); }

    /* Edit Modal Box */
    #editModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.82); z-index: 200; padding: 20px; align-items: center; justify-content: center; }
    .modal-content { background: #1f2133; padding: 20px; border-radius: 12px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; border: 1px solid #3b3f5c; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-content h3 { color: #f59e0b; margin-top: 0; margin-bottom: 15px; font-size: 17px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h1>MAULI GRAPHICS</h1>
    <div id="headerBadge" class="badge">Offline Portal</div>
  </div>

  <!-- 1. LOGIN SCREEN -->
  <div id="loginView">
    <h2 style="color: #f59e0b; margin-top: 0;">School Login</h2>
    <p style="color: #9ca3af; font-size: 13px; margin-bottom: 25px;">फोटो काढण्यासाठी Job ID आणि Password टाका</p>
    <input type="text" id="inputJobId" class="input-box" placeholder="Job ID (उदा. 361248)" inputmode="numeric">
    <input type="password" id="inputPin" class="input-box" placeholder="Login Password" inputmode="numeric">
    <button class="btn btn-login" onclick="login()">Login Kara</button>
  </div>

  <!-- 2. STUDENT LIST SCREEN -->
  <div id="listView">
    <div style="display:flex; justify-content:space-between; align-items:center; margin: 10px 0 12px 0;">
      <div>
        <h3 id="schoolHeading" style="margin:0; font-size: 17px; color:#f3f4f6;">School Name</h3>
        <span id="counterText" style="font-size:12px; color:#9ca3af;">0/0 पूर्ण</span>
      </div>
      <button class="btn-logout" onclick="logout()">बाहेर पडा</button>
    </div>

    <!-- FILTER & SEARCH BAR -->
    <div class="filter-section">
      <input type="text" id="searchInput" class="input-box" style="margin-bottom:0;" placeholder="🔍 Roll No किंवा नावाने शोधा..." oninput="applyAllFilters()">
      
      <!-- Base Filter Row -->
      <div style="display:flex; gap:8px; margin-top:8px;">
        <select id="statusFilter" class="filter-select" onchange="applyAllFilters()">
          <option value="ALL">सर्व स्थिती (All Status)</option>
          <option value="PENDING">बाकी असलेले (Pending)</option>
          <option value="DONE">पूर्ण झालेले (Done)</option>
        </select>
        <button class="filter-toggle-btn" style="flex:1; margin-top:0;" onclick="toggleColumnPicker()">⚙️ सानुकूल फिल्टर्स (Customize Columns)</button>
      </div>

      <!-- Column Checkbox Chooser -->
      <div id="columnPicker" class="column-picker">
        <div style="font-size:12px; color:#f59e0b; font-weight:bold; margin-bottom:8px;">फिल्टर करण्यासाठी कॉलम निवडा (Tick kara):</div>
        <div id="checkboxContainer"></div>
      </div>

      <!-- Container where active checked dropdowns will appear -->
      <div id="dynamicDropdownsContainer" class="dynamic-dropdown-grid"></div>

      <!-- Live Total Summary -->
      <div class="total-counter-bar">
        <div><b>एकूण निकाल:</b> <span id="filteredCount" style="color:#38bdf8; font-weight:bold;">0</span> विद्यार्थी सापडले</div>
        <div style="color:#10b981;"><b>पूर्ण:</b> <span id="filteredDoneCount">0</span> | <span style="color:#f87171;"><b>बाकी:</b> <span id="filteredPendingCount">0</span></span></div>
      </div>
    </div>

    <div id="studentContainer"></div>
  </div>

  <!-- 3. CAMERA FULLSCREEN -->
  <div id="cameraView">
    <div class="cam-header">
      <div id="activeStudentLabel" class="cam-student-name">Student Name</div>
      <button class="btn-close-cam" onclick="closeCamera()">✕</button>
    </div>

    <video id="videoElement" autoplay playsinline></video>

    <!-- Face Guide Frame -->
    <div class="face-guide-container">
      <div class="face-guide-box" id="guideBox"></div>
    </div>

    <div class="cam-controls">
      <button class="btn-snap" onclick="captureAndUpload()"></button>
    </div>
  </div>

  <!-- 4. EDIT STUDENT DATA MODAL -->
  <div id="editModal">
    <div class="modal-content">
      <h3>विद्यार्थ्याची माहिती बदला (Edit)</h3>
      <div id="dynamicEditFields"></div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn" style="background:#10b981; flex:1;" onclick="saveStudentData()">✓ Save Kara</button>
        <button class="btn" style="background:#ef4444; flex:1;" onclick="closeEditModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Hidden Canvas for 300 DPI Cropping -->
  <canvas id="cropCanvas" style="display:none;"></canvas>

<script>
  // SUPABASE CONFIGURATION - MAULI CARDS
  const SUPABASE_URL = "https://cqukjscpdfrfijgqdlyx.supabase.co";
  
  // NOTE: Khali tumchi ti eyJ... anon key verify kara:
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxdWtqc2NwZGZyZmlqZ3FkbHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5ODQzNTIsImV4cCI6MjEwODU2MDM1Mn0.a0v2VZQDqU4wlO1Cj_W6osQkgE7t6IChSqcInLnpX84";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentProject = null;
  let studentsData = [];
  let filteredStudents = [];
  let availableColumns = [];
  let activeSelectedColumns = [];
  let activeStudent = null;
  let mediaStream = null;
  let editingStudentId = null;

  // AUTO DETECT STUDENT NAME
  function getStudentDisplayName(data, srNo) {
    if (!data) return "Student #" + srNo;
    let possible = [
      "Full Name", "Full_Name", "FullName", "full name", "FULL NAME",
      "Name", "NAME", "name", 
      "Student Name", "Student_Name", "StudentName",
      "Vidyarthi Naav", "Vidyarthi", "Student"
    ];
    for (let p of possible) {
      if (data[p] && data[p].toString().trim() !== "") {
        return data[p].toString().trim();
      }
    }
    for (let k in data) {
      if (k.toLowerCase().includes("name") && data[k] && data[k].toString().trim() !== "") {
        return data[k].toString().trim();
      }
    }
    return "Student #" + srNo;
  }

  // LOGIN FUNCTION
  async function login() {
    let jId = document.getElementById('inputJobId').value.trim();
    let pin = document.getElementById('inputPin').value.trim();

    if(!jId || !pin) {
      alert("Job ID आणि Password टाका.");
      return;
    }

    const { data: pData, error: pErr } = await client.from('projects').select('*').eq('id', jId).single();
    if(pErr || !pData || pData.login_password !== pin) {
      alert("चुकीचा Job ID किंवा Password!");
      return;
    }

    currentProject = pData;
    document.getElementById('headerBadge').innerText = "Job: " + jId;
    document.getElementById('schoolHeading').innerText = pData.project_name;
    
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';

    fetchStudents();
  }

  // FETCH STUDENTS
  async function fetchStudents() {
    const { data: sList, error: sErr } = await client.from('students').select('*').eq('project_id', currentProject.id).order('sr_no', { ascending: true });
    if(sErr) {
      alert("विद्यार्थ्यांची यादी लोड करताना अडचण: " + sErr.message);
      return;
    }

    studentsData = sList;

    // Detect 1st row columns from student_data
    if (studentsData.length > 0 && studentsData[0].student_data) {
      availableColumns = Object.keys(studentsData[0].student_data).filter(col => {
        let low = col.toLowerCase();
        // Ignore Photo filename kiva direct large text if not needed
        return !low.includes("photo") && !low.includes("address");
      });
    }

    buildColumnCheckboxes();
    applyAllFilters();
  }

  // TOGGLE COLUMN PICKER BOX
  function toggleColumnPicker() {
    let p = document.getElementById('columnPicker');
    p.style.display = (p.style.display === 'block') ? 'none' : 'block';
  }

  // BUILD CUSTOM CHECKBOXES FOR ALL 1ST ROW COLUMNS
  function buildColumnCheckboxes() {
    let container = document.getElementById('checkboxContainer');
    container.innerHTML = "";

    // Default select STD / Standard if exists
    let defaultPicked = availableColumns.find(c => ["std", "standard", "class"].includes(c.toLowerCase()));
    if (defaultPicked && !activeSelectedColumns.includes(defaultPicked)) {
      activeSelectedColumns.push(defaultPicked);
    }

    availableColumns.forEach(col => {
      let label = document.createElement('label');
      label.className = "col-checkbox-label";
      let isChecked = activeSelectedColumns.includes(col);
      
      label.innerHTML = `
        <input type="checkbox" value="${col}" ${isChecked ? 'checked' : ''} onchange="handleColumnCheck(this)">
        ${col}
      `;
      container.appendChild(label);
    });

    renderDynamicDropdowns();
  }

  // HANDLE USER CHECK/UNCHECK
  function handleColumnCheck(checkbox) {
    let col = checkbox.value;
    if (checkbox.checked) {
      if (!activeSelectedColumns.includes(col)) activeSelectedColumns.push(col);
    } else {
      activeSelectedColumns = activeSelectedColumns.filter(c => c !== col);
    }
    renderDynamicDropdowns();
    applyAllFilters();
  }

  // RENDER DROPDOWNS ONLY FOR CHECKED COLUMNS
  function renderDynamicDropdowns() {
    let dContainer = document.getElementById('dynamicDropdownsContainer');
    dContainer.innerHTML = "";

    activeSelectedColumns.forEach(col => {
      let uniqueVals = new Set();
      studentsData.forEach(st => {
        let val = st.student_data[col];
        if (val !== undefined && val !== null && val.toString().trim() !== "") {
          uniqueVals.add(val.toString().trim());
        }
      });

      let select = document.createElement('select');
      select.id = `dynFilter_${col}`;
      select.className = "filter-select";
      select.onchange = applyAllFilters;

      select.innerHTML = `<option value="ALL">सर्व ${col} (All)</option>`;
      Array.from(uniqueVals).sort().forEach(val => {
        let opt = document.createElement('option');
        opt.value = val;
        opt.innerText = `${col}: ${val}`;
        dContainer.appendChild(opt);
        select.appendChild(opt);
      });

      dContainer.appendChild(select);
    });
  }

  // APPLY ALL FILTERS & CALCULATE TOTAL
  function applyAllFilters() {
    let searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
    let statusVal = document.getElementById('statusFilter').value;

    filteredStudents = studentsData.filter(st => {
      let name = getStudentDisplayName(st.student_data, st.sr_no).toLowerCase();
      let roll = st.sr_no.toString();
      let isDone = st.status === 'completed';

      // 1. Search text match
      let matchSearch = name.includes(searchVal) || roll.includes(searchVal);

      // 2. Status match
      let matchStatus = true;
      if(statusVal === "PENDING") matchStatus = !isDone;
      if(statusVal === "DONE") matchStatus = isDone;

      // 3. Dynamic Checked Column Dropdowns match
      let matchDynamic = true;
      for (let col of activeSelectedColumns) {
        let selectEl = document.getElementById(`dynFilter_${col}`);
        if (selectEl && selectEl.value !== "ALL") {
          let studentVal = (st.student_data[col] || "").toString().trim();
          if (studentVal !== selectEl.value) {
            matchDynamic = false;
            break;
          }
        }
      }

      return matchSearch && matchStatus && matchDynamic;
    });

    // Update Live Totals
    let totalDone = filteredStudents.filter(s => s.status === 'completed').length;
    let totalPending = filteredStudents.length - totalDone;

    document.getElementById('filteredCount').innerText = filteredStudents.length;
    document.getElementById('filteredDoneCount').innerText = totalDone;
    document.getElementById('filteredPendingCount').innerText = totalPending;

    let overallDone = studentsData.filter(s => s.status === 'completed').length;
    document.getElementById('counterText').innerText = `${overallDone} / ${studentsData.length} पूर्ण`;

    renderList();
  }

  // RENDER STUDENT CARDS
  function renderList() {
    let container = document.getElementById('studentContainer');
    container.innerHTML = "";

    if(filteredStudents.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:30px; color:#9ca3af; font-size:14px;">कोणताही विद्यार्थी सापडला नाही.</div>`;
      return;
    }

    filteredStudents.forEach(st => {
      let isDone = st.status === 'completed';
      let displayName = getStudentDisplayName(st.student_data, st.sr_no);
      let roll = st.sr_no;

      // Show badges for currently active checked columns
      let badgesHtml = "";
      activeSelectedColumns.forEach(col => {
        let val = st.student_data[col];
        if(val) badgesHtml += `<span class="st-badge">${col}: ${val}</span>`;
      });

      let card = document.createElement('div');
      card.className = "student-card " + (isDone ? "done" : "");
      card.innerHTML = `
        <div class="st-info">
          <h4>${roll}. ${displayName}</h4>
          <p>
            ${badgesHtml}
            <span style="display:block; margin-top:3px; color:${isDone ? '#10b981' : '#9ca3af'};">
              ${isDone ? "✓ फोटो सेव्ह झाला" : "फोटो बाकी आहे"}
            </span>
          </p>
        </div>
        <div class="action-group">
          <button class="btn-edit" onclick="openEditModal('${st.id}')">✏️ Edit</button>
          <button class="${isDone ? 'btn-done' : 'btn-camera'}" onclick="openCamera('${st.id}')">
            ${isDone ? "🔄 बदला" : "📷 फोटो"}
          </button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // OPEN EDIT MODAL
  function openEditModal(stId) {
    editingStudentId = stId;
    let st = studentsData.find(s => s.id === stId);
    let container = document.getElementById('dynamicEditFields');
    container.innerHTML = "";

    for (let key in st.student_data) {
      let div = document.createElement('div');
      div.style.marginBottom = "10px";
      div.innerHTML = `
        <label style="font-size:12px; color:#cbd5e1; display:block; margin-bottom:4px; font-weight:bold;">${key}:</label>
        <input type="text" id="edit_${key}" value="${st.student_data[key] || ''}" class="input-box" style="margin-bottom:0; padding:10px; font-size:14px;">
      `;
      container.appendChild(div);
    }
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    editingStudentId = null;
  }

  // SAVE UPDATED DATA
  async function saveStudentData() {
    let st = studentsData.find(s => s.id === editingStudentId);
    let updatedData = {};

    for (let key in st.student_data) {
      let inputVal = document.getElementById(`edit_${key}`).value.trim();
      updatedData[key] = inputVal;
    }

    const { error } = await client.from('students').update({
      student_data: updatedData
    }).eq('id', editingStudentId);

    if (error) {
      alert("माहिती बदलताना अडचण आली: " + error.message);
      return;
    }

    st.student_data = updatedData;
    closeEditModal();
    applyAllFilters();
    alert("✓ विद्यार्थ्यांची माहिती यशस्वीरित्या अपडेट झाली!");
  }

  // OPEN CAMERA
  async function openCamera(studentId) {
    activeStudent = studentsData.find(s => s.id === studentId);
    let displayName = getStudentDisplayName(activeStudent.student_data, activeStudent.sr_no);
    document.getElementById('activeStudentLabel').innerText = `${activeStudent.sr_no}. ${displayName}`;

    document.getElementById('cameraView').style.display = 'flex';

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      document.getElementById('videoElement').srcObject = mediaStream;
    } catch(err) {
      alert("कॅमेरा उघडताना एरर आला: " + err.message);
      closeCamera();
    }
  }

  function closeCamera() {
    if(mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('cameraView').style.display = 'none';
  }

  // CAPTURE & CROP
  async function captureAndUpload() {
    let video = document.getElementById('videoElement');
    let canvas = document.getElementById('cropCanvas');
    let ctx = canvas.getContext('2d');

    let vW = video.videoWidth;
    let vH = video.videoHeight;

    let targetW = 600;
    let targetH = 750;

    canvas.width = targetW;
    canvas.height = targetH;

    let sourceW = vW * 0.65;
    let sourceH = sourceW * (targetH / targetW);
    let startX = (vW - sourceW) / 2;
    let startY = (vH - sourceH) / 2;

    ctx.drawImage(video, startX, startY, sourceW, sourceH, 0, 0, targetW, targetH);

    closeCamera();

    canvas.toBlob(async function(blob) {
      let stName = getStudentDisplayName(activeStudent.student_data, activeStudent.sr_no);
      stName = stName.replace(/[^a-zA-Z0-9]/g, "_");
      let filename = `${String(activeStudent.sr_no).padStart(4, '0')}_${stName}.jpg`;
      let filePath = `${currentProject.id}/${filename}`;

      const { error: upErr } = await client.storage.from('student-photos').upload(filePath, blob, {
        upsert: true,
        contentType: 'image/jpeg'
      });

      if(upErr) {
        alert("फोटो अपलोड एरर: " + upErr.message);
        return;
      }

      const { data: pubData } = client.storage.from('student-photos').getPublicUrl(filePath);

      await client.from('students').update({
        photo_url: pubData.publicUrl,
        photo_filename: filename,
        status: 'completed'
      }).eq('id', activeStudent.id);

      activeStudent.status = 'completed';
      activeStudent.photo_url = pubData.publicUrl;
      activeStudent.photo_filename = filename;
      applyAllFilters();

    }, 'image/jpeg', 0.92);
  }

  function logout() {
    currentProject = null;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('headerBadge').innerText = "Offline Portal";
  }
</script>
</body>
</html>
